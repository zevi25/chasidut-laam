<head>
<meta charset="utf-8">

<style>
/* עמוד ספר */
.crumbs{max-width:1200px;margin:26px auto 0;padding:0 20px;font-size:0.9375rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{padding:6px 0;color:var(--blue-2);font-weight:700;text-decoration:none}
.crumbs a:hover{text-decoration:underline}

.pdp{max-width:1200px;margin:18px auto 0;padding:0 20px}
.pdp-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);overflow:hidden}
/* הכריכה בצד ימין, ובטלפון מעל הפרטים */
.pdp-cover{background:linear-gradient(160deg,#f6f5f3,#e7e6e3);display:flex;align-items:center;justify-content:center;padding:46px 30px;min-height:460px}
.pdp-cover img{max-width:100%;height:auto;filter:drop-shadow(0 18px 22px rgba(0,0,0,.22))}
.pdp-info{min-width:0;padding:38px 42px;display:flex;flex-direction:column;gap:14px}
.chip{align-self:flex-start;background:#e8f4f8;color:var(--blue-2);font-weight:800;font-size:0.875rem;padding:8px 16px;border-radius:999px;text-decoration:none}
.pdp-info h1{font-family:"Suez One",serif;font-weight:400;color:var(--title);font-size:clamp(2rem,4vw,3rem);line-height:1.12;margin:0}
.author{color:var(--muted);font-weight:600;margin-top:-6px}
.flags{display:flex;gap:8px;flex-wrap:wrap}
.flag{font-weight:800;font-size:0.875rem;padding:3px 12px;border-radius:999px}
.flag.new{background:#fff4dc;color:#8a4f05}
.flag.back{background:#fff4dc;color:#8a4f05}
.price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price{font-family:"Suez One",serif;font-size:2.75rem;color:var(--ink);line-height:1}
.price small{font-family:"Heebo",sans-serif;font-size:1.0625rem;font-weight:700;color:var(--muted)}
.stock{font-weight:800;font-size:0.9375rem;display:inline-flex;align-items:center;gap:6px}
.stock::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.stock.in{color:#157a3f}
.stock.out{color:var(--sold)}
.stock.ask{color:var(--muted)}
.pdp-desc{font-size:1.125rem;line-height:1.75;margin:0}
.pdp-desc.en,.pdp-info h1.en{direction:ltr;text-align:left}
.buy{border-top:1px solid #edf1f4;padding-top:20px;margin-top:6px;display:flex;flex-direction:column;gap:12px}
.qty-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qty-row label{font-weight:700}
.qty{display:inline-flex;align-items:center;border:2px solid #dbe5ec;border-radius:999px;overflow:hidden}
.qty button{border:0;background:#fff;width:44px;height:44px;font-size:1.375rem;font-weight:700;color:var(--blue-2);cursor:pointer}
.qty button:hover{background:#f4fafc}
.qty output{min-width:40px;text-align:center;font-weight:800;font-size:1.125rem}
.total{color:var(--muted);font-weight:700}
.buy .btn{justify-content:center;white-space:normal;text-align:center;line-height:1.35;font-size:1.125rem;padding:14px 24px}
.btn-wa{box-shadow:0 8px 20px rgba(23,130,68,.25)}
.buy .btn svg{flex:0 0 auto}
.buy .btn:not(.disabled):hover{transform:translateY(-2px)}
.buy .help{text-align:center;color:var(--muted);margin:0}
.buy .help a{display:inline-block;padding:5px 4px;color:var(--blue-2);font-weight:800;direction:ltr;unicode-bidi:isolate;text-decoration:none}
.help{font-size:0.9375rem;color:var(--muted);margin:0}
/* בחירת כרכים */
.vol-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vol-head label{font-weight:800}
.vol-all{border:2px solid var(--ribbon);background:#fff;color:var(--ribbon);font:inherit;font-weight:800;font-size:0.9375rem;padding:6px 16px;border-radius:999px;cursor:pointer}
.vol-all.on{background:var(--ribbon);color:#fff}
.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.vol{border:2px solid #dbe5ec;background:#fff;border-radius:14px;padding:9px 8px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);transition:border-color .15s,background .15s}
.vol b{font-size:1rem}
.vol small{font-size:0.875rem;color:var(--muted)}
.vol:hover{border-color:var(--blue-1)}
.vol.on{border-color:var(--ribbon);background:#e8f4f8;color:var(--blue-2)}
.vol.on small{color:var(--blue-2)}
.sum{font-size:1rem;color:var(--muted)}
.sum b{color:var(--ink);font-size:1.125rem}
.btn.disabled{background:#e3e8ee;color:#5b6475;cursor:not-allowed;box-shadow:none}
.help a{color:var(--blue-2);font-weight:700}

.related{max-width:1200px;margin:0 auto;padding:60px 20px 0}
.related h2{font-family:"Suez One",serif;font-weight:400;color:var(--title);font-size:clamp(1.625rem,3.5vw,2.25rem);text-align:center;margin:0}
.related .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.notfound{max-width:700px;margin:60px auto;padding:40px 30px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.notfound form{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.notfound .search{box-shadow:none;border:2px solid #dbe5ec}
.notfound .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.notfound .chip{align-self:auto;padding:9px 16px}
.notfound h1{font-family:"Suez One",serif;font-weight:400;color:var(--title);margin:0 0 10px}

@media (max-width:1000px){.related .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .pdp-card{grid-template-columns:1fr}
  .pdp-cover{min-height:0;padding:30px 20px}
  .pdp-info{padding:26px 22px}
  .price{font-size:2.375rem}
  .related .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .notfound{margin:30px 16px;padding:30px 20px}
  .vol-all{min-height:44px;padding-inline:18px}
}
</style>

<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="index.html"><img src="img/logo.png" alt="חסידות לעם · ספרי הרב גרין"></a>
    <nav class="nav" id="nav"></nav>
    <a class="phone" href="tel:0546398851">054-6398851</a>
  </div>
</header>

<div id="page"></div>

<footer class="foot">
  <div class="pill">
    <span class="label">להשגת הספרים: "חסידות לעם"</span>
    <a class="num" href="tel:0546398851">054-6398851</a>
  </div>
  <p><a href="index.html">לכל הספרים</a> · <a href="about.html">על הרב יקותיאל גרין ע"ה</a></p>
</footer>

<script>window.BOOK_ID = "hashem-echad";</script>
<script src="data.js?v=6"></script>
<script src="lib.js?v=4"></script>
<script>
// BOOK_ID: בעמודים שנבנים בהעלאה (book-lemaan.html). אחרת המזהה בא מהכתובת (book.html?b=lemaan)
const b = findItem(window.BOOK_ID || new URLSearchParams(location.search).get("b") || "");
const page = document.getElementById("page");

// הפס העליון: אותן קטגוריות כמו בקטלוג, והקטגוריה של הספר מסומנת
document.getElementById("nav").innerHTML = CATS.map(c =>
  '<a href="index.html#' + c.id + '"' + (b && b.cat.id === c.id ? ' class="on"' : '') + '>' + short(c) + '</a>').join("")
  + '<a class="about-link" href="about.html">על הרב גרין</a>';

function cardHTML(x){
  const url = bookUrl(x), en = x.cat.en;
  return '<article class="book' + (x.price === "sold" ? ' is-sold' : '') + '">'
    + '<a class="shelf" href="' + url + '"><img loading="lazy" style="width:' + (x.isSeries ? '100%' : 'calc(var(--bookw) * ' + (IMG_R[x.img] || 1) + ')') + '" src="covers/' + x.img + '.png?v=' + IMG_V + '" alt="' + esc(x.name) + '"></a>'
    + '<div class="body"><a class="ribbon' + (en ? ' en" lang="en' : '') + '" href="' + url + '">' + esc(x.name) + '</a>'
    + '<p class="desc' + (en ? ' en" lang="en' : '') + '">' + esc(x.desc) + '</p>'
    + '<a class="order" href="' + url + '">לפרטים ←</a>' + priceTag(x) + '</div></article>';
}

if (!b) {
  document.title = "הספר לא נמצא · חסידות לעם";
  page.innerHTML = '<main class="notfound"><h1>הספר לא נמצא</h1><p>ייתכן שהקישור שגוי. אפשר לחפש אותו בקטלוג, או להתקשר: 054-6398851</p>'
    + '<form action="index.html"><input class="search" type="search" name="q" aria-label="חיפוש ספר" placeholder="חיפוש ספר"><button class="btn btn-blue" style="border:0;font-family:inherit;cursor:pointer">חיפוש</button></form>'
    + '<a class="btn btn-blue btn-lg" href="index.html">' + ICON_BOOK + 'לכל הספרים</a>'
    + '<div class="chips">' + CATS.map(c => '<a class="chip" href="index.html#' + c.id + '">' + esc(short(c)) + '</a>').join("") + '</div></main>';
} else {
  const en = !!b.cat.en, sold = b.price === "sold", ask = b.price == null, sellable = !sold && !ask && !b.hidePrice;
  document.title = b.name + " · ספרי הרב יקותיאל גרין · חסידות לעם";
  document.querySelector('meta[name="description"]').content = b.name + ": " + b.desc;
  document.querySelector('link[rel="canonical"]').href = "https://zevi25.github.io/chasidut-laam/book-" + encodeURIComponent(b.img) + ".html";

  const coverW = b.isSeries ? '100%' : 'calc(250px * ' + (IMG_R[b.img] || 1) + ')';
  const stock = sold ? '<span class="stock out">אזל כרגע</span>'
              : ask ? '<span class="stock ask">המחיר בטלפון</span>'
              : '<span class="stock in">במלאי</span>';
  const flags = (b.isNew ? '<span class="flag new">חדש!</span>' : '') + (b.back ? '<span class="flag back">חזר למלאי</span>' : '');
  const priceHTML = b.hidePrice ? ''
    : '<div class="price-row">' + (typeof b.price === "number" ? '<span class="price">' + b.price + NIS + (b.per ? ' <small>לכרך</small>' : '') + '</span>' : '') + stock + '</div>';

  page.innerHTML =
    '<nav class="crumbs" aria-label="מיקום"><a href="index.html">הספרים</a><span>›</span><a href="index.html#' + b.cat.id + '">' + esc(short(b.cat)) + '</a><span>›</span><span>' + esc(b.name) + '</span></nav>'
    + '<main class="pdp"><div class="pdp-card">'
    + '<div class="pdp-cover"><img style="width:' + coverW + '" src="covers/' + b.img + '.png?v=' + IMG_V + '" alt="' + esc(b.name) + '"></div>'
    + '<div class="pdp-info">'
    +   '<a class="chip" href="index.html#' + b.cat.id + '">' + esc(short(b.cat)) + '</a>'
    +   '<h1' + (en ? ' class="en" lang="en"' : '') + '>' + esc(b.name) + '</h1>'
    +   '<div class="author">הרב יקותיאל גרין ע"ה</div>'
    +   (flags ? '<div class="flags">' + flags + '</div>' : '')
    +   priceHTML
    +   '<p class="pdp-desc' + (en ? ' en" lang="en' : '') + '">' + esc(b.desc) + '</p>'
    +   '<div class="buy" id="buy"></div>'
    + '</div>'
    + '</div></main>';

  // תיבת ההזמנה: כמות + כפתור. כשהסליקה תופעל (CHECKOUT.enabled ו-payUrl לספר) יופיע כפתור תשלום
  const buy = document.getElementById("buy");
  if (b.hidePrice) {
    buy.innerHTML = '<p class="help">הספרים בסדרה מופיעים למטה, ולכל אחד מהם יש עמוד משלו.</p>';
  } else if (!sellable) {
    const t = sold ? 'שלום, רציתי לברר אם הספר "' + b.name + '" צפוי לחזור למלאי' : 'שלום, אשמח לשמוע מה המחיר של הספר "' + b.name + '"';
    buy.innerHTML = '<a class="btn btn-wa" target="_blank" rel="noopener" href="' + wa(t) + '">' + ICON_WA + (sold ? "לברר על הדפסה חוזרת בוואטסאפ" : "לברר מחיר בוואטסאפ") + '</a>'
      + '<p class="help">אפשר גם לברר בטלפון: <a href="tel:0546398851">054-6398851</a></p>';
  } else if (b.volumes) {
    volumePicker(buy);
  } else {
    let qty = 1;
    const unit = b.per ? "כרכים" : "עותקים";
    buy.innerHTML = '<div class="qty-row"><label>כמה ' + unit + '?</label>'
      + '<span class="qty"><button type="button" id="minus" aria-label="פחות">−</button><output id="qty">1</output><button type="button" id="plus" aria-label="יותר">+</button></span>'
      + '<span class="total" id="total"></span></div>'
      + (CHECKOUT.enabled && b.payUrl ? '<a class="btn btn-blue" id="pay" href="' + esc(b.payUrl) + '">לתשלום מאובטח</a>' : '')
      + '<a class="btn btn-wa" id="order" target="_blank" rel="noopener" href="#">' + ICON_WA + 'להזמנה בוואטסאפ</a>'
      + '<p class="help">אפשר גם להזמין בטלפון: <a href="tel:0546398851">054-6398851</a></p>';
    const update = () => {
      document.getElementById("qty").textContent = qty;
      document.getElementById("total").innerHTML = qty > 1 ? 'סה"כ ' + (qty * b.price) + NIS : '';
      const what = qty > 1 ? qty + " " + unit + ' של "' + b.name + '"' : (b.per ? 'כרך אחד של "' + b.name + '"' : 'את הספר "' + b.name + '"');
      document.getElementById("order").href = wa("שלום, אשמח להזמין " + what);
    };
    document.getElementById("minus").onclick = () => { if (qty > 1) { qty--; update(); } };
    document.getElementById("plus").onclick = () => { if (qty < 99) { qty++; update(); } };
    update();
  }

  // סדרה בכמה כרכים: בוחרים כרכים מסוימים או את כל הסט, ואז כמה עותקים מכל כרך
  function volumePicker(box){
    const HEB = ["א","ב","ג","ד","ה","ו","ז","ח","ט","י"];
    const vols = b.volumes.map((range, i) => ({ n:HEB[i], range }));
    const label = v => "כרך " + v.n + "'" + (v.range ? " (" + b.volWord + " " + v.range + ")" : "");
    const picked = new Set();
    let qty = 1;
    box.innerHTML = '<div class="vol-head"><label>איזה כרכים?</label><button type="button" class="vol-all" id="all">כל הסט · ' + vols.length + ' כרכים</button></div>'
      + '<div class="vols">' + vols.map((v, i) => '<button type="button" class="vol" data-i="' + i + '" aria-pressed="false"><b>כרך ' + v.n + "'</b>" + (v.range ? '<small>' + b.volWord + ' ' + v.range + '</small>' : '') + '</button>').join("") + '</div>'
      + '<div class="qty-row"><label>כמה עותקים מכל כרך?</label>'
      + '<span class="qty"><button type="button" id="minus" aria-label="פחות">−</button><output id="qty">1</output><button type="button" id="plus" aria-label="יותר">+</button></span></div>'
      + '<div class="sum" id="sum"></div>'
      + '<a class="btn btn-wa" id="order" target="_blank" rel="noopener" href="#">' + ICON_WA + '<span id="order-txt">להזמנה בוואטסאפ</span></a>'
      + '<p class="help">אפשר גם להזמין בטלפון: <a href="tel:0546398851">054-6398851</a></p>';
    const order = document.getElementById("order");
    const update = () => {
      box.querySelectorAll(".vol").forEach(el => { const on = picked.has(+el.dataset.i); el.classList.toggle("on", on); el.setAttribute("aria-pressed", on); });
      const all = picked.size === vols.length;
      document.getElementById("all").classList.toggle("on", all);
      document.getElementById("qty").textContent = qty;
      const count = picked.size * qty;
      document.getElementById("sum").innerHTML = picked.size
        ? (all ? 'כל הסט' : picked.size + (picked.size === 1 ? ' כרך' : ' כרכים')) + (qty > 1 ? ' × ' + qty + ' עותקים' : '') + ' · <b>סה"כ ' + (count * b.price) + NIS + '</b>'
        : 'בחרו כרך אחד או יותר';
      order.classList.toggle("disabled", !picked.size); order.setAttribute("aria-disabled", !picked.size); document.getElementById("order-txt").textContent = picked.size ? "להזמנה בוואטסאפ" : "בחרו כרך כדי להזמין"; order.querySelector("svg").style.display = picked.size ? "" : "none";
      const which = all ? 'את כל הסט (' + vols.length + ' כרכים)' : [...picked].sort((x, y) => x - y).map(i => label(vols[i])).join(", ");
      order.href = picked.size ? wa('שלום, אשמח להזמין מ"' + b.name + '" (משכיל לאיתן): ' + which + (qty > 1 ? ', ' + qty + ' עותקים מכל כרך' : '')) : "#";
    };
    box.querySelectorAll(".vol").forEach(el => el.onclick = () => { const i = +el.dataset.i; picked.has(i) ? picked.delete(i) : picked.add(i); update(); });
    document.getElementById("all").onclick = () => { if (picked.size === vols.length) picked.clear(); else vols.forEach((v, i) => picked.add(i)); update(); };
    document.getElementById("minus").onclick = () => { if (qty > 1) { qty--; update(); } };
    document.getElementById("plus").onclick = () => { if (qty < 99) { qty++; update(); } };
    order.addEventListener("click", e => { if (!picked.size) e.preventDefault(); });
    update();
  }

  // עוד ספרים מאותה קטגוריה
  const more = allItems.filter(x => x.cat.id === b.cat.id && x.img !== b.img && !x.hidePrice).slice(0, 4);
  if (more.length) page.insertAdjacentHTML("beforeend",
    '<section class="related"><h2>עוד ב' + esc(short(b.cat)) + '</h2><div class="grid">' + more.map(cardHTML).join("") + '</div></section>');
}
</script>
</body>
</html>
