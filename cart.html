<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סל ההזמנה · חסידות לעם</title>
<meta name="description" content="סל ההזמנה של ספרי הרב יקותיאל גרין ע&quot;ה. שליחת ההזמנה בוואטסאפ.">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="theme-color" content="#1666a8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Suez+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=9">
<script src="data.js?v=6"></script>
<script src="a11y.js?v=3"></script>
<script src="menu.js?v=5"></script>
<script src="cart.js?v=1"></script>
<style>
.wrap{max-width:900px;margin:30px auto 0;padding:0 20px}
.wrap h1{font-family:"Suez One",serif;font-weight:400;color:var(--title);font-size:clamp(2rem,5vw,2.8rem);margin:0 0 14px;text-align:center}
.box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 26px 24px}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #edf1f4}
.line img{width:72px;height:90px;object-fit:contain}
.line h2{font-size:1.125rem;margin:0;line-height:1.35}.line h2 a{text-decoration:none;color:var(--title)}
.line .vols{font-size:.9375rem;color:var(--muted);margin-top:2px}
.line .ctl{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:2px solid #dbe5ec;border-radius:999px;overflow:hidden}
.qty button{border:0;background:#fff;width:40px;height:40px;font-size:1.3rem;font-weight:700;color:var(--blue-2);cursor:pointer}
.qty output{min-width:34px;text-align:center;font-weight:800}
.rm{border:0;background:none;color:var(--muted);font:inherit;font-size:.9375rem;text-decoration:underline;cursor:pointer;padding:8px 4px}
.lt{font-weight:800;font-size:1.25rem;white-space:nowrap}
.line.na{opacity:.75}.line.na .lt{color:var(--sold);font-size:1rem}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px;font-size:1.25rem;font-weight:800}
.total span{font-family:"Suez One",serif;font-size:2rem;font-weight:400}
.note{color:var(--muted);font-size:.9375rem;margin:4px 0 18px}
.send{width:100%;justify-content:center;font-size:1.15rem;padding:16px}
.after{display:none;text-align:center;margin-top:14px;color:var(--muted)}.after.show{display:block}
.after button{border:2px solid var(--blue-2);background:#fff;color:var(--blue-2);font:inherit;font-weight:800;border-radius:999px;padding:8px 18px;margin:8px 6px 0;cursor:pointer}
.empty{text-align:center;padding:40px 10px}.empty p{font-size:1.1rem;color:var(--muted)}
@media (max-width:600px){.box{padding:6px 16px 20px}.line{grid-template-columns:56px minmax(0,1fr);gap:12px}.line img{width:56px;height:72px}.lt{grid-column:2;font-size:1.1rem}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="index.html"><img src="img/logo.png" alt="חסידות לעם · ספרי הרב גרין, לעמוד הבית"></a>
    <nav class="nav"><a href="index.html">הספרים</a><a class="about-link" href="about.html">על הרב גרין</a></nav>
    <a class="phone" href="tel:0546398851">054-6398851</a>
  </div>
</header>

<main class="wrap" id="content" tabindex="-1">
  <h1>סל ההזמנה</h1>
  <div class="box" id="box"></div>
</main>

<footer class="foot">
  <div class="pill">
    <span class="label">להשגת הספרים: "חסידות לעם"</span>
    <a class="num" href="tel:0546398851">054-6398851</a>
  </div>
  <p><a href="index.html">לכל הספרים</a> · <a href="start.html">מאיפה מתחילים?</a> · <a href="about.html">על הרב יקותיאל גרין ע"ה</a></p>
</footer>

<script src="lib.js?v=5"></script>
<script>
const box = document.getElementById("box");
function render(){
  const items = Cart.items();
  if (!items.length) { box.innerHTML = '<div class="empty"><p>הסל ריק כרגע.</p><a class="btn btn-blue btn-lg" href="index.html">' + ICON_BOOK + 'לכל הספרים</a><p style="margin-top:22px"><a href="start.html">לא בטוחים מה לבחור? מאיפה מתחילים ←</a></p></div>'; return; }
  let total = 0, lines = [], msg = [];
  items.forEach((x, i) => {
    const b = findItem(x.img), ok = b && typeof b.price === "number";
    const n = x.vols ? x.vols.length : 1, sum = ok ? b.price * n * x.qty : 0;
    const vols = b && x.vols ? x.vols.map(v => volLabel(b, v)).join(", ") : "";
    if (ok) { total += sum; msg.push((msg.length + 1) + ". " + b.name + (x.vols ? (b.cat.id === "tanya" ? " (משכיל לאיתן)" : "") + ": " + vols : "") + (x.qty > 1 ? (x.vols ? " · " + x.qty + " עותקים מכל כרך" : " · " + x.qty + " עותקים") : "") + " · " + sum + " ₪"); }
    lines.push('<div class="line' + (ok ? '' : ' na') + '">'
      + (b ? '<a href="' + bookUrl(b) + '" tabindex="-1" aria-hidden="true"><img src="covers/' + b.img + '.png?v=' + IMG_V + '" alt=""></a>' : '<span></span>')
      + '<div><h2>' + (b ? '<a href="' + bookUrl(b) + '"' + (b.cat.en ? ' lang="en"' : '') + '>' + esc(b.name) + '</a>' : 'ספר שכבר לא באתר') + '</h2>'
      + (vols ? '<div class="vols">' + esc(vols) + '</div>' : '')
      + '<div class="ctl"><span class="qty"><button type="button" data-q="' + i + '" data-d="-1" aria-label="פחות">−</button><output aria-label="' + (x.vols ? 'עותקים מכל כרך' : 'עותקים') + '">' + x.qty + '</output><button type="button" data-q="' + i + '" data-d="1" aria-label="יותר">+</button></span>'
      + (x.vols ? '<span class="vols">עותקים מכל כרך</span>' : '') + '<button type="button" class="rm" data-rm="' + i + '">הסרה</button></div></div>'
      + '<div class="lt">' + (ok ? sum + NIS : !b ? 'לא זמין' : b.price === "sold" ? 'אזל כרגע' : 'מחיר בטלפון') + '</div></div>');
  });
  const text = "שלום, אשמח להזמין:\n" + msg.join("\n") + "\n\nסה\"כ: " + total + " ₪ (לפני משלוח)";
  box.innerHTML = lines.join("")
    + '<div class="total">סה"כ<span>' + total + NIS + '</span></div>'
    + '<p class="note">המחיר לא כולל משלוח. את פרטי המשלוח והתשלום סוגרים יחד בוואטסאפ או בטלפון ' + '<a href="tel:0546398851" style="direction:ltr;unicode-bidi:isolate">054-6398851</a>.'
    + (lines.length > msg.length ? ' ספר שאזל או שהמחיר שלו בטלפון לא ייכלל בהודעה.' : '') + '</p>'
    + (msg.length ? '<a class="btn btn-wa send" id="send" target="_blank" rel="noopener" href="' + wa(text) + '">' + ICON_WA + 'שליחת ההזמנה בוואטסאפ</a>' : '')
    + '<div class="after" id="after">שלחתם את ההזמנה?<br><button type="button" id="clear">כן, לרוקן את הסל</button><button type="button" id="keep">עוד לא</button></div>';
  const send = document.getElementById("send");
  if (send) send.addEventListener("click", () => document.getElementById("after").classList.add("show"));
}
box.addEventListener("click", e => {
  const q = e.target.closest("[data-q]"), rm = e.target.closest("[data-rm]");
  if (q) { const i = +q.dataset.q; Cart.setQty(i, Cart.items()[i].qty + +q.dataset.d); render(); }
  else if (rm) { Cart.remove(+rm.dataset.rm); render(); }
  else if (e.target.id === "clear") { Cart.clear(); render(); }
  else if (e.target.id === "keep") document.getElementById("after").classList.remove("show");
});
render();
</script>
</body>
</html>
