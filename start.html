<script src="lib.js?v=5"></script>
<script>
// הקבוצות והספרים בכל אחת. הספרים עצמם (שם, תיאור, מחיר ומלאי) נלקחים מ-data.js
const GROUPS = [{"t": "מכירים את התניא בפעם הראשונה", "p": "ספרי מבוא קצרים, לפני שנכנסים לביאור המלא.", "b": ["tiferet", "leiyun", "teshuva-derech"]}, {"t": "רוצים ללמוד תניא ברצינות, פרק אחר פרק", "p": "סדרת \"משכיל לאיתן\": ביאור שוטף עם הגדרות וסיכומים, שמתאים גם ללימוד עצמי. מתחילים מלקוטי אמרים, כרך א'.", "b": ["likutei", "shaar", "kodesh"]}, {"t": "לילדים", "p": "תניא לילדים נלמד במוסדות חב\"ד בגילאים 7-13. \"שמע בני\" מומלץ ללימוד בבתי הספר היסודיים.", "b": ["kids-set", "kids-tet", "shma"]}, {"t": "להורים ולמחנכים", "p": "הדרכה בחינוך, במידות ובדרך להגיע אל הילד והתלמיד.", "b": ["klalei", "horaah", "tikun", "naar"]}, {"t": "לנוער ולמקורבים", "p": "מאמרי האדמו\"רים בנושאים בסיסיים, מנוקדים ומבוארים בשפה קלה.", "b": ["chayei", "kuntres-maayan", "hashem-echad"]}, {"t": "מתנה לבר מצווה", "p": "המאמר לבר המצווה על מהותה של מצוות תפילין, מנוקד ומבואר.", "b": ["tefillin"]}, {"t": "לקראת החגים", "p": "", "b": ["hagada", "yetziat", "kinyan", "bati"]}, {"t": "אהבת ישראל", "p": "חמישה ספרים על אהבת ישראל באור החסידות. הכי קל להתחיל במאמר של הרבי הריי\"צ.", "b": ["ahavat-rayatz", "ahavat-tanya"]}, {"t": "באנגלית", "p": "Books in English", "b": ["en-veata", "en-love", "en-bati", "en-kinyan"]}];
document.getElementById("ask").insertAdjacentHTML("afterbegin", ICON_WA);
document.getElementById("ask").href = wa("שלום, אשמח להמלצה על ספר של הרב גרין. הספר מיועד ל...");
function card(x){
  const url = bookUrl(x), en = x.cat.en;
  return '<article class="book' + (x.price === "sold" ? ' is-sold' : '') + '">'
    + '<a class="shelf" href="' + url + '"><img loading="lazy" style="width:' + (x.isSeries ? '100%' : 'calc(var(--bookw) * ' + (IMG_R[x.img] || 1) + ')') + '" src="covers/' + x.img + '.png?v=' + IMG_V + '" alt="' + esc(x.name) + '"></a>'
    + '<div class="body"><a class="ribbon' + (en ? ' en" lang="en' : '') + '" href="' + url + '">' + esc(x.name) + '</a>'
    + '<p class="desc' + (en ? ' en" lang="en' : '') + '">' + esc(x.desc) + '</p>'
    + '<a class="order" href="' + url + '">' + (x.price === "sold" ? "לפרטים ולבירור" : "לפרטים ולהזמנה") + ' ←</a>' + priceTag(x) + addBtn(x) + '</div></article>';
}
const G = GROUPS.map((g, i) => ({ ...g, id:"g" + i, items:g.b.map(findItem).filter(Boolean) })).filter(g => g.items.length);
document.getElementById("jump").innerHTML = G.map(g => '<a href="#' + g.id + '">' + g.t + '</a>').join("");
document.getElementById("groups").innerHTML = G.map(g => '<section class="group" id="' + g.id + '"><h2>' + g.t + '</h2>' + (g.p ? '<p' + (/^[A-Za-z]/.test(g.p) ? ' lang="en"' : '') + '>' + esc(g.p) + '</p>' : '') + '<div class="grid">' + g.items.map(card).join("") + '</div></section>').join("");
</script>
